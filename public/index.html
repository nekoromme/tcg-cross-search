<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>TCG横断在庫検索</title>
  <link rel="stylesheet" href="/styles.css?v=0.3.0">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>TCG横断在庫検索</h1>
      <p>商品名・JAN・型番で、登録済みショップを必要な時だけ横断検索する個人用ツール。</p>
    </header>

    <section class="panel">
      <form id="searchForm">
        <div class="searchRow">
          <input id="query" type="search" autocomplete="off" enterkeyhint="search" maxlength="100"
                 aria-label="商品名・型番" placeholder="例：GD03 / Steel Requiem" required>
          <button id="searchButton" type="submit">横断検索</button>
        </div>
        <div class="options">
          <label><input id="forceRefresh" type="checkbox"> 最新情報を取り直す</label>
        </div>
        <div id="history" class="history" aria-label="最近の検索"></div>
      </form>
    </section>

    <section class="panel compact">
      <div class="displayOptions">
        <label for="unitFilter">販売単位
          <select id="unitFilter"><option value="box">BOXのみ</option><option value="sealed">BOX＋カートン・セット</option><option value="all">パックなども含める</option></select>
        </label>
        <label for="sortOrder">並び順
          <select id="sortOrder"><option value="price_asc">価格が安い順</option><option value="price_desc">価格が高い順</option><option value="stock">在庫あり優先</option><option value="store">店名順</option></select>
        </label>
        <label class="stockFilter"><input id="inStockOnly" type="checkbox"> 在庫ありのみ</label>
      </div>
      <div class="summary" aria-live="polite">
        <span id="progress">ショップ一覧を読み込み中…</span>
        <span id="resultCount"></span>
      </div>
    </section>

    <section id="results" class="results">
      <div class="empty">検索語を入れて実行して。</div>
    </section>

    <details id="reviewPanel" class="panel diagnostics" hidden>
      <summary id="reviewSummary">確認が必要な候補</summary>
      <p class="help">価格・在庫・販売単位のどれかを確認できなかった候補。商品ページで確認できます。</p>
      <div id="reviewResults" class="results"></div>
    </details>

    <details class="panel diagnostics">
      <summary>店舗別の検索状況・店内検索リンク</summary>
      <div id="storeStatuses" class="statusList"></div>
    </details>

    <p class="foot">
      表示価格は商品単位・送料別。各店の検索結果の先頭ページから最大8候補を抽出し、BOXを優先して最大4件の詳細を確認します。全商品の網羅・最安値は保証しません。注文前に商品ページで価格・在庫・販売条件を確認してください。
    </p>
  </main>
  <script type="module" src="/app.js?v=0.3.0"></script>
</body>
</html>
